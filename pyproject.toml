[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-drone-platform"
version = "2.0.0"
description = "Simulation-grade autonomous drone platform for control, mission, and architecture validation; not a certified or flight-ready avionics system"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Autonomous Drone Platform contributors" }
]
license = { text = "MIT" }
keywords = ["drone", "simulation", "autopilot", "control", "unittest"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "matplotlib>=3.7",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"
